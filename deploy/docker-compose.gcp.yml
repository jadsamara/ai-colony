# Generated dedicated department deployment.
# Ollama and mock endpoints are private to the compose network.
# colony stop uses `docker compose stop` and never deletes volumes.
# MODE=real. Do not start this file until provision accepts the GPU capacity limits.
name: ai-colony-dedicated
services:
  ollama-ceo:
    image: ollama/ollama:0.9.6
    environment:
      COLONY_DEPARTMENT_SLUG: ceo
      COLONY_INSTANCE_ID: 00000000-0000-4000-8000-000000000311
      COLONY_MODEL_VERSION: qwen3-8b-base-v1
    labels:
      colony.mode: real
      colony.department: ceo
      colony.instance: 00000000-0000-4000-8000-000000000311
      colony.model: qwen3-8b-base-v1
      colony.endpoint: http://ollama-ceo:11434
      colony.gpu: unassigned
    volumes:
      - colony-model-ceo:/root/.ollama
    networks: [colony-dedicated]
    mem_limit: 8g
    cpus: 2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
  agent-ceo:
    image: ${COLONY_AGENT_IMAGE:-ai-colony-agent:m12.1}
    pull_policy: ${COLONY_AGENT_PULL_POLICY:-build}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agent
    command: ["node", "packages/workflows/dist/cli.js", "ceo"]
    environment:
      COLONY_DEPARTMENT_SLUG: ceo
      COLONY_DEPARTMENT_ID: 00000000-0000-4000-8000-000000000011
      COLONY_AGENT_ID: 00000000-0000-4000-8000-000000000201
      COLONY_INSTANCE_ID: 00000000-0000-4000-8000-000000000311
      COLONY_MODEL_VERSION: qwen3-8b-base-v1
      COLONY_MODE: real
      COLONY_ACCEPT_TASKS: ${COLONY_ACCEPT_TASKS:-false}
      COLONY_DEDICATED_ROUTING: ${COLONY_DEDICATED_ROUTING:-off}
      COLONY_ACTIVATION_FILE: /var/colony/dedicated-routing.json
      INFERENCE_BASE_URL: http://ollama-ceo:11434
      INFERENCE_MODEL_ALIAS: ${INFERENCE_MODEL_ALIAS:-qwen3:8b}
      DATABASE_URL: ${DATABASE_URL:-}
      RABBITMQ_URL: ${RABBITMQ_URL:-}
    labels:
      colony.mode: real
      colony.department: CEO
      colony.instance: 00000000-0000-4000-8000-000000000311
      colony.model: qwen3-8b-base-v1
      colony.endpoint: http://ollama-ceo:11434
      colony.memory: department:ceo
    volumes:
      - ${COLONY_ACTIVATION_HOST_PATH:-./deploy/state}:/var/colony:ro
    depends_on:
      ollama-ceo:
        condition: service_healthy
    networks: [colony-dedicated]
    mem_limit: 1g
    cpus: 1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://ollama-ceo:11434/api/version').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
