# Generated dedicated department deployment.
# Ollama and mock endpoints are private to the compose network.
# colony stop uses `docker compose stop` and never deletes volumes.
# MODE=mock. These processes do not load Qwen weights and are not a real-model deployment.
name: ai-colony-dedicated
services:
  mock-ceo:
    image: ai-colony-mock:m12.1
    pull_policy: build
    build:
      context: mock-image
      dockerfile: Dockerfile
    command: ["node", "mock-cli.js"]
    environment:
      COLONY_DEPARTMENT_SLUG: ceo
      COLONY_DEPARTMENT_ID: 00000000-0000-4000-8000-000000000011
      COLONY_INSTANCE_ID: 00000000-0000-4000-8000-000000000311
      COLONY_BIND: 0.0.0.0
      COLONY_MOCK_PORT: "8080"
      COLONY_MODE: mock
    labels:
      colony.mode: mock
      colony.department: ceo
      colony.instance: 00000000-0000-4000-8000-000000000311
      colony.model: qwen3-8b-base-v1
      colony.endpoint: http://mock-ceo:8080
    networks: [colony-mock]
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
  agent-ceo:
    image: ai-colony-mock:m12.1
    pull_policy: never
    command: ["node", "department-process.js"]
    environment:
      COLONY_DEPARTMENT_SLUG: ceo
      COLONY_DEPARTMENT_ID: 00000000-0000-4000-8000-000000000011
      COLONY_AGENT_ID: 00000000-0000-4000-8000-000000000201
      COLONY_INSTANCE_ID: 00000000-0000-4000-8000-000000000311
      COLONY_MODEL_VERSION: qwen3-8b-base-v1
      COLONY_ENDPOINT: http://mock-ceo:8080
      COLONY_MODE: mock
      COLONY_ACCEPT_TASKS: "false"
    labels:
      colony.mode: mock
      colony.department: CEO
      colony.instance: 00000000-0000-4000-8000-000000000311
      colony.model: qwen3-8b-base-v1
      colony.endpoint: http://mock-ceo:8080
      colony.memory: department:ceo
    depends_on:
      mock-ceo:
        condition: service_healthy
    networks: [colony-mock]
    mem_limit: 128m
